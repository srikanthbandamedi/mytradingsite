name: Deploy site

# Publishes the website only when the site itself changes (2026-11-06).
# Log pushes every 5 minutes don't need a deploy: app.js reads logs straight from the repo.
# Needs Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths-ignore: ["logs/**", "data/**", "backtest/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
