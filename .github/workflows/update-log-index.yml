name: Update log index

# Whenever new daily logs are pushed, rebuild logs/index.json so the site lists them.
on:
  push:
    branches: [main]
    paths: ["logs/**", "scripts/build_index.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_index.py
      - name: Commit index if it changed
        run: |
          if git diff --quiet logs/index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add logs/index.json
          git commit -m "Update log index"
          git push
