<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Log</title>
<meta name="description" content="Daily buy and sell log from my trading algorithm.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="#">Trade Log</a>
    <span class="tagline">Daily activity from my trading algorithm</span>
  </div>
</header>

<div class="wrap layout">
  <aside class="days" aria-label="Trading days">
    <h2>Days</h2>
    <select id="day-select" aria-label="Choose a day"></select>
    <ul id="day-list"></ul>
  </aside>

  <main id="day-view">
    <p class="muted">Loading logs…</p>
  </main>
</div>

<footer class="wrap">
  <p class="muted">Logs are published by the algorithm. Times are Central (CT) unless noted.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
